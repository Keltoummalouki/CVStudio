name: Database migrations

# Applies supabase/migrations to the hosted Supabase project. It only ever runs
# when started by hand (Actions > Database migrations > Run workflow), and does
# a dry run unless "Apply" is ticked. Nothing applies migrations automatically.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the pending migrations (unticked = dry run that only lists them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate hosted database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the secrets below; add yourself as a required reviewer in the
    # repository's environment settings to approve every run.
    environment: production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    # Secrets are passed only to the steps that need them, never to the
    # dependency install.
    steps:
      - name: Check the configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APPLY: ${{ inputs.apply }}
          REF: ${{ github.ref }}
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("secret SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("secret SUPABASE_DB_PASSWORD")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("variable SUPABASE_PROJECT_REF")
          if [ ${#missing[@]} -gt 0 ]; then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error::Add to the production environment: ${list%, }"
            exit 1
          fi
          if [ "$APPLY" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Migrations are applied from main only. Run a dry run from other branches."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Supabase CLI version pinned in package.json.
      - uses: ./.github/actions/setup
      - name: Link the hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: List pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --dry-run
      - name: Apply pending migrations
        if: ${{ inputs.apply }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push
