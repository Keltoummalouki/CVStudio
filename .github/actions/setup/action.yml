name: Set up CVStudio
description: Installs pnpm (version from package.json) and Node.js with the pnpm store cache, then the locked dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # The version the project is developed on (package.json engines allow 22.12+ or 24+).
        node-version: "24"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
